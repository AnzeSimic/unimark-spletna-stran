        required: true
      - name: slika_opis
        label: Opis glavne slike (za slabovidne in Google)
        type: string
      - name: naslov_strani
        label: Naslov na strani storitve
        type: string
      - name: uvod
        label: Uvodni stavek pod naslovom
        type: text
      - name: besedilo
        label: Opis storitve
        type: rich-text
        options:
          format: html
          media: false
      - name: slika2
        label: Druga slika (pod opisom)
        type: image
      - name: slika2_opis
        label: Opis druge slike
        type: string
      - name: vkljucuje
        label: Kaj vključuje čiščenje
        type: string
        list: true
      - name: dodatno
        label: Dodatno po dogovoru
        type: string
        list: true
      - name: za_koga
        label: Za koga je storitev primerna
        type: string
        list: true
      - name: vprasanja
        label: Pogosta vprašanja pri tej storitvi
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.vprasanje}"
        fields:
          - name: vprasanje
            label: Vprašanje
            type: string
            required: true
          - name: odgovor
            label: Odgovor
            type: rich-text
            required: true
            options:
