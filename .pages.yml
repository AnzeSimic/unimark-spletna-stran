  - name: storitve
    label: Storitve
    type: collection
    path: content/storitve
    format: json
    filename: "{fields.kratko_ime}.json"
    view:
      fields: [naslov, vrstni_red]
      primary: naslov
      sort: [vrstni_red, naslov]
      default:
        sort: vrstni_red
        order: asc
    operations:
      rename: false
    fields:
      - name: naslov
        label: Ime storitve
