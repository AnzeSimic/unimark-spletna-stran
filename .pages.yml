# Nastavitve urejevalnika Pages CMS (https://app.pagescms.org)
# Stranka tukaj ureja vsebino v mapi content/ in fotografije v assets/img/foto/.
# Po vsakem shranjevanju GitHub stran samodejno zgradi in objavi na unimark.si (čez nekaj minut).

media:
  input: assets/img/foto
  output: /assets/img/foto
  extensions: [jpg, jpeg, png, webp]
  rename: safe

settings:
  hide: true

content:
  - name: podjetje
    label: Kontakt in delovni čas
    type: file
    path: content/podjetje.json
    format: json
    fields:
      - name: telefon
        label: Telefonska številka
        type: string
        required: true
        description: "Npr. 070 325 039. Prikaže se v glavi, nogi in na vseh gumbih »Pokličite«."
      - name: email
        label: E-poštni naslov
        type: string
        required: true
        description: "Prikazan na strani. Povpraševanja z obrazca še naprej prihajajo na info.unimark@gmail.com."
      - name: delovni_cas_pon_pet
        label: Delovni čas od ponedeljka do petka
        type: string
        required: true
        description: "Zapis kot 6.00–18.00"
      - name: delovni_cas_sobota
        label: Delovni čas v soboto
        type: string
        description: "Zapis kot 8.00–13.00. Če ob sobotah ne delate, napišite Zaprto."

  - name: strani
    label: Besedila in slike strani
    type: group
    items:
      - name: stran-domov
        label: "Domača stran"
        type: file
        path: content/strani/index.json
        format: json
        fields:
          - name: uvod
            label: "Uvod (veliki naslov na vrhu)"
            type: object
            fields:
              - name: znacka
                label: "Napis nad naslovom"
                type: string
              - name: naslov
                label: "Glavni naslov"
                type: string
              - name: besedilo
                label: "Besedilo pod naslovom"
                type: text
              - name: slika
                label: "Slika v ozadju"
                type: image
                description: "Široka, ležeča fotografija."
              - name: kljukice
                label: "Kratke prednosti s kljukico"
                type: string
                list: true
          - name: prednosti
            label: "Pas s štirimi prednostmi"
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.naslov}"
            fields:
              - name: naslov
                label: "Naslov"
                type: string
              - name: besedilo
                label: "Besedilo"
                type: string
              - name: ikona
                label: "Ikona"
                type: select
                options:
                  values:
                    - { name: check, label: "Kljukica" }
                    - { name: calendar, label: "Koledar" }
                    - { name: flask, label: "Steklenička" }
                    - { name: users, label: "Ljudje" }
                    - { name: euro, label: "Evro" }
                    - { name: clipboard, label: "Seznam" }
                    - { name: sparkles, label: "Iskrice" }
                    - { name: shield, label: "Ščit" }
                    - { name: target, label: "Tarča" }
                    - { name: eye, label: "Oko" }
                    - { name: home, label: "Hiša" }
                    - { name: office, label: "Pisarna" }
                    - { name: window, label: "Okno" }
                    - { name: spray, label: "Razpršilo" }
                    - { name: drop, label: "Kapljica" }
                    - { name: clock, label: "Ura" }
                    - { name: phone, label: "Telefon" }
                    - { name: star, label: "Zvezda" }
          - name: storitve
            label: "Razdelek Storitve"
            type: object
            description: "Kartice storitev urejate v razdelku Storitve."
            fields:
